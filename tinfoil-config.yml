# Tinfoil deploy config for the TRT-LLM benchbox (Kimi-K2.6-NVFP4, 8xB300/inf14).
# Mirrors the vLLM Kimi B300 config (model-benchbox @ 9d2ddc0) — SAME cvm, sizing,
# and mpk — so the only variable vs the vLLM baseline is the serving engine.
#
# Deploy:  tinfoil container create benchtrt-cc-<on|off> \
#            --repo <org>/model-benchbox-trtllm --tag <ver> --debug \
#            --host control.inf14.tinfoil.sh --ssh-key tanya-key \
#            --secret GITHUB_TOKEN --secret HF_TOKEN --secret TINFOIL_API_KEY \
#            [--disable-cc-mode --yes]      # add for the cc-off arm only

cvm-version: 0.10.4
cpus: 128
memory: 1048576        # 1 TiB
gpus: 8

# Kimi K2.6 NVFP4 (ModelOpt) — the EXACT mpk the B300 vLLM baseline served, staged
# on inf14 at /tinfoil/mpk/mpk-23653f0b…. NVFP4 = TRT-LLM's native ingestable format.
models:
  - name: "kimi-k2-6"
    repo: "nvidia/Kimi-K2.6-NVFP4@2fd3a800dedd098b8327eb49e93ebc75f85da19f"
    mpk: "23653f0bad86c7ad6d4994a2607858662c56ed3ba205252f5714ba8636db35f8_595219173376_907a1c65-6c08-5c3c-9efa-e564282c7da0"

containers:
  - name: "benchbox"
    # CREDS-FREE PATH: deploy the STOCK, PUBLICLY-PULLABLE TRT-LLM release image
    # directly (no NGC login, no ghcr push, no custom build) and inject guidellm +
    # the bench/ scripts at runtime over SSH. release:1.3.0rc18 is the published
    # tag (rc19 is local source only) and ships modeling_kimi_k25.py (since rc7).
    image: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc18"
    command: ["sleep", "infinity"]   # keep it alive as a debug bench shell (boot honors `command`)
    runtime: nvidia
    gpus: all
    ipc: host            # large writable /dev/shm for TRT-LLM/torch/FlashInfer scratch + caches
    restart: always
    # TRT-LLM/FlashInfer may fetch NVFP4 cubins from edge.urm.nvidia.com at first
    # serve — egress is gated by tinfoild's per-deploy firewall keyed to declared
    # networks, so the container MUST be on "web" (runtime docker-connect won't fix it).
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # CVM rootfs is read-only; serve.sh redirects TMPDIR/HF_HOME/caches to /dev/shm,
    # but cover the paths that aren't env-redirectable.
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=8g,mode=0700,exec

networks:
  web:
    egress: open

# Accessed via debug-mode SSH, not HTTPS. shim block is schema-required but unused
# (nothing listens on 8000 inside the container; serve.sh binds :8001).
shim:
  upstream-port: 8000
  paths:
    - /health
