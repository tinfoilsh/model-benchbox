cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

# Kimi K2.6 (NVFP4) weights, provisioned into the benchbox CVM at
# /tinfoil/models/kimi-k2-6 so the kimi-probe harness (kimi_serve.sh) can run a
# local in-process vLLM engine for multi-GPU (TP=8) CC-overhead benchmarking
# over localhost. The wrapped .mpk must be pre-staged on the target host — it is
# cached on inf8 (H200), so deploy with `--host control.inf8.tinfoil.sh`.
models:
  - name: "kimi-k2-6"
    repo: "moonshotai/Kimi-K2.6@7eb5002f6aadc958aed6a9177b7ed26bb94011bb"
    mpk: "baf763c7922bbafd337dc3aa86c9059f694169c51b1e0197d0d441aeea51186c_595205046272_7b0f3f16-bf8d-5206-8d14-088929943faf"

containers:
  - name: "benchbox"
    models: ["kimi-k2-6"]
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:4d29f30e6da5c20bc94b464c0d99e5ea65100e8b718841dd800f878169c10148" # v0.0.20
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network so FlashInfer can fetch NVFP4 MoE cubins from
    # edge.urm.nvidia.com at serve time (the container is otherwise only on the
    # internal shim-net and has no egress).
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; vLLM/torch/FlashInfer need writable scratch.
    # (/dev/shm is large via ipc:host and used for caches; these cover the paths
    # that aren't redirectable by env, mirroring the production Kimi config.)
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=8g,mode=0700,exec
      /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins: size=8g,mode=1777,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
