cvm-version: 0.10.4
cpus: 32
memory: 262144
gpus: 1

# Gemma-4-31B (bf16, dense) for SINGLE-GPU TRT-LLM CC-overhead baselines on
# inf14/B300. This is the TRT-LLM counterpart to the vLLM Gemma single-GPU arm.
# Mirror the vLLM CVM exactly: 32 cpus / 1 GPU for BOTH cc-on and cc-off, so
# there is no host-CPU confound. nospec, so the MTP assistant head is NOT
# needed/mounted.
#
# This uses a patched TRT-LLM rc18 image because stock rc18 forces a v2 host
# KV-cache tier for Gemma4 hybrid attention, and that host-memory CUDA path
# fails under NVIDIA confidential computing.
#
# Deploy (one arm at a time — same box, sequential):
#   cc-on:   tinfoil container create benchtrt-gemma-cc-on \
#              --repo tinfoilsh/model-benchbox --tag <ver> --debug \
#              --host control.inf14.tinfoil.sh --ssh-key <key> \
#              --secret GITHUB_TOKEN --secret HF_TOKEN --secret TINFOIL_API_KEY
#   cc-off:  same + --disable-cc-mode --yes        # NO separate tag — same config
#   (inf14 = B300)
models:
  - name: "gemma-4-31b"
    repo: "google/gemma-4-31B-it@fb9ae262347c3945692f09a612f8bb189def854f"
    mpk: "d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4_62578688000_421c697b-8a62-59e2-9085-819a35012c0b"

containers:
  - name: "benchbox"
    # Custom image: FROM nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc18, with
    # TRTLLM_DISABLE_V2_HOST_KV_CACHE=1 baked in and the Gemma bench harness
    # copied into /workspace/bench. The release workflow rewrites this tag to a
    # measured ghcr.io digest.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:34b1c8e77d6e00d2b60a23e09c7a513eef59e89d351f0f79275aed5e5626b234" # v0.0.14
    command: ["sleep", "infinity"]   # keep alive as a debug bench shell (boot honors `command`)
    runtime: nvidia
    gpus: all
    ipc: host            # large writable /dev/shm for TRT-LLM/torch/FlashInfer scratch + caches
    restart: always
    # TRT-LLM/FlashInfer may fetch cubins from edge.urm.nvidia.com at first serve —
    # egress is gated by tinfoild's per-deploy firewall keyed to declared networks,
    # so the container MUST be on "web".
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # CVM rootfs is read-only; serve.sh redirects TMPDIR/HF_HOME/caches to /dev/shm,
    # but cover the paths that aren't env-redirectable.
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=8g,mode=0700,exec

networks:
  web:
    egress: open

# Accessed via debug-mode SSH, not HTTPS. shim block is schema-required but unused
# (nothing listens on 8000 inside the container; serve.sh binds :8001).
shim:
  upstream-port: 8000
  paths:
    - /health
