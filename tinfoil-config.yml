cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

# Qwen 3.5 397B-A17B FP8 weights, provisioned into the benchbox CVM at
# /tinfoil/mpk/mpk-<hash> for the SGLang CC benchmark harness. The wrapped .mpk
# is pre-staged on inf14.
models:
  - name: "qwen3-5-397b-a17b"
    repo: "Qwen/Qwen3.5-397B-A17B@8472618112abcbd45acbcdc58436aff4233c23f7"
    mpk: "009e9a10b01acb7a61225cba9280d584b2f06d0fb35f1fe4a031c01143bb3a87_806819586048_f8c2f08a-ddde-56b5-946f-9f78fee99150"

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:b1eb1a5739df393f8cee4ea5223648de01afc7bbf0efbcfff1a451969e95de69" # v0.0.19
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network for HF dataset/model downloads and any NeMo
    # runtime package metadata access.
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; torch/NeMo/HF need writable scratch.
    # /dev/shm is large via ipc:host and is used for caches/results.
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=16g,mode=0700,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block is
# required by schema but never exercised.
shim:
  upstream-port: 8000
  paths:
    - /health
