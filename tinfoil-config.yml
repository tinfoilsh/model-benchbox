cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:5307ca8f850fbe01d8ac380e12ec295d09ce2325a076a6d1fb3bf79d9c147952" # v0.0.6
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
