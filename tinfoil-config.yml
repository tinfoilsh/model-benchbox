cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

# Llama 3.3 70B bf16 weights, provisioned into the benchbox CVM at
# /tinfoil/mpk/mpk-<hash> so the NeMo AutoModel training harness can fine-tune
# from the local checkpoint instead of downloading the 265 GiB model in each arm.
# The wrapped .mpk is pre-staged on inf14.
models:
  - name: "llama3-3-70b"
    repo: "meta-llama/Llama-3.3-70B-Instruct@6f6073b423013f6a7d4d9f39144961bfbfbc386b"
    mpk: "0cf252baf75fd3594a4c88a4cf76521e4b9d1b50fd72ca2dd2984e0738730726_282254876672_ac2a39df-75d0-575a-8e8a-fae8926214e1"

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:3cc6736f5dc2b0d868b1222205b6f84d7cbe3adb7ac54de543a7a8263b9e01c1" # v0.0.21
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network for HF dataset/model downloads and any NeMo
    # runtime package metadata access.
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; torch/NeMo/HF need writable scratch.
    # /dev/shm is large via ipc:host and is used for caches/results.
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=16g,mode=0700,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block is
# required by schema but never exercised.
shim:
  upstream-port: 8000
  paths:
    - /health
