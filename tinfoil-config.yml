cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

# Kimi K2.6 (NVFP4) weights, provisioned into the benchbox CVM at
# /tinfoil/mpk/mpk-<hash> so `bench/serve.sh` can run a local in-process vLLM
# engine for CC-overhead benchmarking over localhost. The wrapped .mpk must be
# pre-staged on the target host (it is cached on inf14) — deploy with
# `--host control.inf14.tinfoil.sh`.
models:
  - name: "kimi-k2-6"
    repo: "nvidia/Kimi-K2.6-NVFP4@2fd3a800dedd098b8327eb49e93ebc75f85da19f"
    mpk: "23653f0bad86c7ad6d4994a2607858662c56ed3ba205252f5714ba8636db35f8_595219173376_907a1c65-6c08-5c3c-9efa-e564282c7da0"

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:98c7aed43d4ae3c9f648e9566bbe32063be6b91a99bab4abde7cb124b2c36522" # v0.0.7
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network so FlashInfer can fetch NVFP4 MoE cubins from
    # edge.urm.nvidia.com at serve time (the container is otherwise only on the
    # internal shim-net and has no egress).
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; vLLM/torch/FlashInfer need writable scratch.
    # (/dev/shm is large via ipc:host and used for caches; these cover the paths
    # that aren't redirectable by env, mirroring the production Kimi config.)
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=8g,mode=0700,exec
      /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins: size=8g,mode=1777,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
