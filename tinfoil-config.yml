cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

# Gemma 4 31B weights, provisioned into the benchbox CVM at
# /tinfoil/mpk/mpk-<hash> so the NeMo AutoModel training harness can fine-tune
# from a local HF-compatible checkpoint instead of downloading the 31B model in
# each arm. The wrapped .mpk must be pre-staged on the target host; this is the
# same Gemma MPK used by confidential-gemma4-31b.
models:
  - name: "gemma-4-31b"
    repo: "google/gemma-4-31B-it@fb9ae262347c3945692f09a612f8bb189def854f"
    mpk: "d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4_62578688000_421c697b-8a62-59e2-9085-819a35012c0b"

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:e0df853160209d5a8ef0f6ef9de2972c7f1b4b2ea4004a0a581b72a0dfe0629c" # v0.0.18
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network for HF dataset/model downloads and any NeMo
    # runtime package metadata access.
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; torch/NeMo/HF need writable scratch.
    # /dev/shm is large via ipc:host and is used for caches/results.
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=16g,mode=0700,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block is
# required by schema but never exercised.
shim:
  upstream-port: 8000
  paths:
    - /health
