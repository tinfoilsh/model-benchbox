cvm-version: 0.10.4
cpus: 128
memory: 1048576
gpus: 8

# Kimi K2.6 NVFP4 weights, provisioned into the benchbox CVM at
# /tinfoil/mpk/mpk-<hash> so the NeMo AutoModel training harness can attempt
# Kimi VLM LoRA fine-tuning from the local checkpoint instead of downloading
# the 595 GB model in each arm. The wrapped .mpk is pre-staged on inf14.
models:
  - name: "kimi-k2-6"
    repo: "nvidia/Kimi-K2.6-NVFP4@2fd3a800dedd098b8327eb49e93ebc75f85da19f"
    mpk: "23653f0bad86c7ad6d4994a2607858662c56ed3ba205252f5714ba8636db35f8_595219173376_907a1c65-6c08-5c3c-9efa-e564282c7da0"

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:e0df853160209d5a8ef0f6ef9de2972c7f1b4b2ea4004a0a581b72a0dfe0629c" # v0.0.18
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network for HF dataset/model downloads and any NeMo
    # runtime package metadata access.
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; torch/NeMo/HF need writable scratch.
    # /dev/shm is large via ipc:host and is used for caches/results.
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=16g,mode=0700,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block is
# required by schema but never exercised.
shim:
  upstream-port: 8000
  paths:
    - /health
