cvm-version: 0.10.4
cpus: 32
memory: 262144
gpus: 1

# Gemma-4-31B + its MTP assistant heads, for single-GPU serving probes
# (phase-2 CC-overhead campaign). Both mpks are staged on inf14.
models:
  - name: "gemma-4-31b"
    repo: "google/gemma-4-31B-it@fb9ae262347c3945692f09a612f8bb189def854f"
    mpk: "d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4_62578688000_421c697b-8a62-59e2-9085-819a35012c0b"
  - name: "gemma-4-31b-assistant"
    repo: "google/gemma-4-31B-it-assistant@34ef9f029d1c52bccac2def222523af32f3ccd0f"
    mpk: "2d92158d05e976de143bd05ff87977c73523ce6adeff1b559ebf32a2d230d634_971251712_27ee073f-136c-5855-a1a3-1fdc293ec0bb"

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:9a44634e1ddead0ced0079e02f66fff4a96e5c4122fcc8bd8d537106771ed24d" # v0.0.8
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    # Attach the egress network so FlashInfer can fetch NVFP4 MoE cubins from
    # edge.urm.nvidia.com at serve time (the container is otherwise only on the
    # internal shim-net and has no egress).
    networks: ["web"]
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY
    # The CVM rootfs is read-only; vLLM/torch/FlashInfer need writable scratch.
    # (/dev/shm is large via ipc:host and used for caches; these cover the paths
    # that aren't redirectable by env, mirroring the production Kimi config.)
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=8g,mode=0700,exec
      /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins: size=8g,mode=1777,exec

networks:
  web:
    egress: open

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
